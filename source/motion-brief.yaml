concept_contract: source/concept-contract.yaml
identity_bible: null
parameter_space: discrete
media_access: sequential
gesture_policy:
  unit: one-gesture-one-step
  inertia: coalesce
  while_active: retarget
  boundary: clamp
  programmatic_navigation: ignore
storyboard:
  - "idle：原始 TPrompts 插画保持静止"
  - "linking：System Prompt 与 User Input 之间出现连线和焦点框"
  - "prompt-ready：光标抵达 Output Format，输出模块高亮并出现短促确认闪光"
keyframes:
  - id: K0
    state: idle
  - id: K1
    state: linking
  - id: K2
    state: prompt-ready
clip_chain:
  - id: tprompts-link
    from: idle
    to: linking
  - id: tprompts-confirm
    from: linking
    to: prompt-ready
rest_state: "idle；失去输入时回到当前反向进度，最终停在 idle"
loop: none
anchor: center
scene_continuity: null
frame_policy: native
target_fps: 60
quality_target: "Pilot 使用 SVG 几何层叠加现有静态 JPG；正式媒体至少覆盖 420x260 CSS px × DPR 2"
reduced_motion: "只显示原始 K0，并保留按钮焦点状态，不自动播放"
