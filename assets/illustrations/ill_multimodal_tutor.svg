<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <pattern id="gridPat8" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E0D8" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#bgGrad8)" stroke="#1F242F" stroke-width="2.5"/>
  <rect width="600" height="450" rx="16" fill="url(#gridPat8)" opacity="0.65"/>

  <!-- Title Badge Top Left -->
  <g transform="translate(30, 30)">
    <rect width="210" height="28" rx="6" fill="#1F242F"/>
    <text x="105" y="18" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">TEACH PLAYER / 多模态导学</text>
  </g>

  <!-- Video Player Window (Center Left) -->
  <g transform="translate(80, 100)">
    <rect width="260" height="180" rx="8" fill="#1E293B" stroke="#1F242F" stroke-width="2.5" filter="drop-shadow(3px 3px 0px #1F242F)"/>
    <!-- Top Bar -->
    <rect width="260" height="22" rx="8 8 0 0" fill="#0F172A"/>
    <circle cx="14" cy="11" r="3.5" fill="#EF4444"/>
    <circle cx="26" cy="11" r="3.5" fill="#F59E0B"/>
    <circle cx="38" cy="11" r="3.5" fill="#10B981"/>
    <text x="54" y="14" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8">TeachPlayer_KeyFrame_04.mp4</text>
    <!-- Video Content Area -->
    <rect x="10" y="30" width="240" height="110" rx="4" fill="#020617"/>
    <!-- Big Play Icon with Glow -->
    <polygon points="120,70 145,85 120,100" fill="#F59E0B"/>
    <!-- Audio Waveform in Player Bottom -->
    <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round">
      <line x1="20" y1="125" x2="20" y2="135"/>
      <line x1="26" y1="120" x2="26" y2="140"/>
      <line x1="32" y1="115" x2="32" y2="145"/>
      <line x1="38" y1="125" x2="38" y2="135"/>
      <line x1="44" y1="110" x2="44" y2="150"/>
      <line x1="50" y1="122" x2="50" y2="138"/>
      <line x1="56" y1="118" x2="56" y2="142"/>
    </g>
    <!-- Progress Timeline Bar -->
    <rect x="10" y="152" width="240" height="6" rx="3" fill="#334155"/>
    <rect x="10" y="152" width="130" height="6" rx="3" fill="#F59E0B"/>
    <circle cx="140" cy="155" r="6" fill="#FFF" stroke="#F59E0B" stroke-width="2"/>
    <!-- Time Code -->
    <text x="10" y="172" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8">04:28 / 12:45</text>
  </g>

  <!-- Interactive AI Tutor Sidecard (Right) -->
  <g transform="translate(370, 90)">
    <rect width="180" height="240" rx="10" fill="#FFF" stroke="#1F242F" stroke-width="2.5" filter="drop-shadow(3px 3px 0px #1F242F)"/>
    <rect width="180" height="32" rx="10 10 0 0" fill="#F59E0B"/>
    <text x="90" y="21" fill="#1F242F" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle">🤖 AI 即时导学助手</text>
    
    <!-- Chat Bubble 1: Student Question -->
    <g transform="translate(10, 44)">
      <rect width="150" height="36" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#1E293B">“04:28这里的卷积核参数怎么理解？”</text>
    </g>

    <!-- Chat Bubble 2: AI Tutor Answer -->
    <g transform="translate(20, 90)">
      <rect width="150" height="56" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
      <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#92400E">导师解析：</text>
      <text x="8" y="30" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#78350F">PointNet++ 的采样半径为 0.2，用于提取管壁局部几何法向量。</text>
    </g>

    <!-- Auto-Generated Quiz Pill (TPaper Link) -->
    <g transform="translate(10, 160)">
      <rect width="160" height="60" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="10" y="18" fill="#1D4ED8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800">📝 TPaper 联动考题生成</text>
      <text x="10" y="34" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="7.5">Q1: 该点云语义分割的损失函数是？</text>
      <rect x="10" y="42" width="60" height="12" rx="3" fill="#3B82F6"/>
      <text x="40" y="51" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="700" text-anchor="middle">立即作答 ▶</text>
    </g>
  </g>

  <!-- Interactive Action Bar (Bottom) -->
  <g transform="translate(80, 310)">
    <rect width="470" height="90" rx="8" fill="#FFF" stroke="#1F242F" stroke-width="2"/>
    <text x="20" y="24" fill="#1F242F" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900">⚡ 双语逐字稿实时高亮 · OCR 关键帧锚定</text>
    <!-- Keyframe Snippets -->
    <rect x="20" y="34" width="90" height="42" rx="4" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="65" y="52" fill="#0369A1" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">Frame #01: 管道结构</text>
    <text x="65" y="66" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="6.5" text-anchor="middle">01:15 • 点云输入</text>

    <rect x="125" y="34" width="90" height="42" rx="4" fill="#FEF3C7" stroke="#FBBF24" stroke-width="1.2"/>
    <text x="170" y="52" fill="#B45309" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">Frame #02: 局部采样</text>
    <text x="170" y="66" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="6.5" text-anchor="middle">04:28 • FPS 算法</text>

    <rect x="230" y="34" width="90" height="42" rx="4" fill="#DCFCE7" stroke="#4ADE80" stroke-width="1.2"/>
    <text x="275" y="52" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">Frame #03: 分割输出</text>
    <text x="275" y="66" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="6.5" text-anchor="middle">09:12 • 精度评测</text>

    <rect x="335" y="34" width="115" height="42" rx="4" fill="#1E293B"/>
    <text x="392" y="58" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" text-anchor="middle">+ 智能生成导学案</text>
  </g>
</svg>
