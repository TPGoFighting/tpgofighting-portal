<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <radialGradient id="portalGlow12" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1F242F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPat12" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E0D8" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#bgGrad12)" stroke="#1F242F" stroke-width="2.5"/>
  <rect width="600" height="450" rx="16" fill="url(#gridPat12)" opacity="0.65"/>

  <!-- Title Badge Top Left -->
  <g transform="translate(30, 30)">
    <rect width="210" height="28" rx="6" fill="#1F242F"/>
    <text x="105" y="18" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">TP SPACE / 宇宙门户矩阵</text>
  </g>

  <!-- Large Circular Portal Gateway in Center -->
  <circle cx="300" cy="220" r="130" fill="url(#portalGlow12)"/>
  <circle cx="300" cy="220" r="110" fill="none" stroke="#1F242F" stroke-width="3"/>
  <circle cx="300" cy="220" r="90" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="300" cy="220" r="70" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8,6"/>
  <circle cx="300" cy="220" r="45" fill="#1E293B" stroke="#1F242F" stroke-width="2.5"/>
  <text x="300" y="226" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="900" text-anchor="middle">TP</text>

  <!-- Orbiting Subdomain Satellites with Badges -->
  <!-- Satellite 1: ai.tpgofighting.top -->
  <g transform="translate(140, 120)">
    <circle cx="0" cy="0" r="22" fill="#FFF" stroke="#1F242F" stroke-width="2.2"/>
    <text x="0" y="5" font-size="14" text-anchor="middle">🤖</text>
    <rect x="-45" y="28" width="90" height="16" rx="4" fill="#1F242F"/>
    <text x="0" y="39" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">ai.tpgofighting</text>
  </g>

  <!-- Satellite 2: tpself.tpgofighting.top -->
  <g transform="translate(460, 120)">
    <circle cx="0" cy="0" r="22" fill="#FFF" stroke="#1F242F" stroke-width="2.2"/>
    <text x="0" y="5" font-size="14" text-anchor="middle">🌟</text>
    <rect x="-45" y="28" width="90" height="16" rx="4" fill="#1F242F"/>
    <text x="0" y="39" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">tpself.tpgofighting</text>
  </g>

  <!-- Satellite 3: tangpan.tpgofighting.top -->
  <g transform="translate(100, 280)">
    <circle cx="0" cy="0" r="22" fill="#FFF" stroke="#1F242F" stroke-width="2.2"/>
    <text x="0" y="5" font-size="14" text-anchor="middle">📖</text>
    <rect x="-50" y="28" width="100" height="16" rx="4" fill="#1F242F"/>
    <text x="0" y="39" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">tangpan.tpgofighting</text>
  </g>

  <!-- Satellite 4: prompts.tpgofighting.top -->
  <g transform="translate(500, 280)">
    <circle cx="0" cy="0" r="22" fill="#FFF" stroke="#1F242F" stroke-width="2.2"/>
    <text x="0" y="5" font-size="14" text-anchor="middle">🪄</text>
    <rect x="-50" y="28" width="100" height="16" rx="4" fill="#1F242F"/>
    <text x="0" y="39" fill="#FB7185" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">prompts.tpgofighting</text>
  </g>

  <!-- Satellite 5: teach.tpgofighting.top -->
  <g transform="translate(300, 370)">
    <circle cx="0" cy="0" r="22" fill="#FFF" stroke="#1F242F" stroke-width="2.2"/>
    <text x="0" y="5" font-size="14" text-anchor="middle">🎓</text>
    <rect x="-48" y="28" width="96" height="16" rx="4" fill="#1F242F"/>
    <text x="0" y="39" fill="#A855F7" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">teach.tpgofighting</text>
  </g>

  <!-- Orbit Guides Connecting Satellites to Portal Core -->
  <g stroke="#1F242F" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6">
    <line x1="300" y1="220" x2="140" y2="120"/>
    <line x1="300" y1="220" x2="460" y2="120"/>
    <line x1="300" y1="220" x2="100" y2="280"/>
    <line x1="300" y1="220" x2="500" y2="280"/>
    <line x1="300" y1="220" x2="300" y2="370"/>
  </g>
</svg>
