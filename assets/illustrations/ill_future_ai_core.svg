<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <radialGradient id="coreGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1F242F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPat3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E0D8" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#bgGrad3)" stroke="#1F242F" stroke-width="2.5"/>
  <rect width="600" height="450" rx="16" fill="url(#gridPat3)" opacity="0.65"/>

  <!-- Title Badge Top Left -->
  <g transform="translate(30, 30)">
    <rect width="180" height="28" rx="6" fill="#1F242F"/>
    <text x="90" y="18" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">AI CORE / 神经网络核心</text>
  </g>

  <!-- Central Glow Matrix -->
  <circle cx="300" cy="230" r="140" fill="url(#coreGlow3)"/>

  <!-- Orbit Rings (Isometric Ellipses) -->
  <ellipse cx="300" cy="230" rx="200" ry="85" fill="none" stroke="#1F242F" stroke-width="1.8" stroke-dasharray="6,6" transform="rotate(-15 300 230)"/>
  <ellipse cx="300" cy="230" rx="220" ry="70" fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-dasharray="4,4" transform="rotate(25 300 230)"/>
  <ellipse cx="300" cy="230" rx="150" ry="120" fill="none" stroke="#F59E0B" stroke-width="2" transform="rotate(50 300 230)"/>

  <!-- Central Geometric Neural Core (Icosahedron / Diamond) -->
  <g transform="translate(300, 230)">
    <!-- Back Diamond Facets -->
    <polygon points="0,-70 55,-20 0,30 -55,-20" fill="#E2E8F0" stroke="#1F242F" stroke-width="2.2"/>
    <polygon points="0,30 55,-20 50,60 0,80" fill="#CBD5E1" stroke="#1F242F" stroke-width="2.2"/>
    <polygon points="0,30 -55,-20 -50,60 0,80" fill="#94A3B8" stroke="#1F242F" stroke-width="2.2"/>
    
    <!-- Floating Glowing Crystal in Center -->
    <polygon points="0,-40 30,0 0,40 -30,0" fill="#F59E0B" stroke="#1F242F" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="#FFF"/>
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#1F242F" text-anchor="middle">✦</text>
  </g>

  <!-- Neural Nodes & Interconnecting Synapse Lines -->
  <!-- Left Side Nodes -->
  <g stroke="#1F242F" stroke-width="2">
    <line x1="300" y1="160" x2="160" y2="130"/>
    <line x1="245" y1="210" x2="120" y2="230"/>
    <line x1="250" y1="290" x2="150" y2="330"/>
    <!-- Right Side Nodes -->
    <line x1="300" y1="160" x2="440" y2="130"/>
    <line x1="355" y1="210" x2="480" y2="230"/>
    <line x1="350" y1="290" x2="450" y2="330"/>
  </g>

  <!-- Satellite Agent Bubbles -->
  <!-- Node 1: Vision / Multimodal -->
  <g transform="translate(160, 130)">
    <circle cx="0" cy="0" r="26" fill="#FFF" stroke="#1F242F" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="18" fill="#E0F2FE"/>
    <text x="0" y="5" font-size="16" text-anchor="middle">👁️</text>
    <rect x="-35" y="32" width="70" height="18" rx="4" fill="#1E293B"/>
    <text x="0" y="44" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">Vision</text>
  </g>

  <!-- Node 2: Reasoning / LLM -->
  <g transform="translate(120, 230)">
    <circle cx="0" cy="0" r="28" fill="#FFF" stroke="#1F242F" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="20" fill="#FEF3C7"/>
    <text x="0" y="6" font-size="18" text-anchor="middle">⚡</text>
    <rect x="-40" y="34" width="80" height="18" rx="4" fill="#1E293B"/>
    <text x="0" y="46" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">Reasoning</text>
  </g>

  <!-- Node 3: Tools / Execution -->
  <g transform="translate(150, 330)">
    <circle cx="0" cy="0" r="26" fill="#FFF" stroke="#1F242F" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="18" fill="#DCFCE7"/>
    <text x="0" y="5" font-size="16" text-anchor="middle">🛠️</text>
    <rect x="-35" y="32" width="70" height="18" rx="4" fill="#1E293B"/>
    <text x="0" y="44" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">Actions</text>
  </g>

  <!-- Node 4: 3D PointCloud -->
  <g transform="translate(440, 130)">
    <circle cx="0" cy="0" r="26" fill="#FFF" stroke="#1F242F" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="18" fill="#EDE9FE"/>
    <text x="0" y="5" font-size="16" text-anchor="middle">🧊</text>
    <rect x="-35" y="32" width="70" height="18" rx="4" fill="#1E293B"/>
    <text x="0" y="44" fill="#A855F7" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">3D Cloud</text>
  </g>

  <!-- Node 5: Context Memory -->
  <g transform="translate(480, 230)">
    <circle cx="0" cy="0" r="28" fill="#FFF" stroke="#1F242F" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="20" fill="#FFE4E6"/>
    <text x="0" y="6" font-size="18" text-anchor="middle">🧠</text>
    <rect x="-40" y="34" width="80" height="18" rx="4" fill="#1E293B"/>
    <text x="0" y="46" fill="#FB7185" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">Memory OS</text>
  </g>

  <!-- Node 6: Knowledge Graph -->
  <g transform="translate(450, 330)">
    <circle cx="0" cy="0" r="26" fill="#FFF" stroke="#1F242F" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="18" fill="#CCFBF1"/>
    <text x="0" y="5" font-size="16" text-anchor="middle">🌐</text>
    <rect x="-35" y="32" width="70" height="18" rx="4" fill="#1E293B"/>
    <text x="0" y="44" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">Graph Net</text>
  </g>

  <!-- Floating Data Particles -->
  <circle cx="280" cy="110" r="3" fill="#F59E0B"/>
  <circle cx="330" cy="120" r="4" fill="#3B82F6"/>
  <circle cx="260" cy="350" r="4" fill="#10B981"/>
  <circle cx="340" cy="360" r="3" fill="#EC4899"/>
</svg>
