<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <radialGradient id="vinylGlow9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <pattern id="gridPat9" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E0D8" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#bgGrad9)" stroke="#1F242F" stroke-width="2.5"/>
  <rect width="600" height="450" rx="16" fill="url(#gridPat9)" opacity="0.65"/>

  <!-- Title Badge Top Left -->
  <g transform="translate(30, 30)">
    <rect width="210" height="28" rx="6" fill="#1F242F"/>
    <text x="105" y="18" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">VIBE CODING / 黑胶与音符</text>
  </g>

  <!-- Turntable Player Base (Left) -->
  <g transform="translate(70, 100)">
    <!-- Turntable Wood/Metal Body -->
    <rect width="220" height="200" rx="12" fill="#E2E8F0" stroke="#1F242F" stroke-width="2.5" filter="drop-shadow(4px 4px 0px #1F242F)"/>
    
    <!-- Spinning Vinyl Record -->
    <circle cx="100" cy="100" r="85" fill="url(#vinylGlow9)" stroke="#1F242F" stroke-width="2"/>
    <!-- Vinyl Grooves -->
    <circle cx="100" cy="100" r="72" fill="none" stroke="#334155" stroke-width="1.2"/>
    <circle cx="100" cy="100" r="58" fill="none" stroke="#334155" stroke-width="1.2"/>
    <circle cx="100" cy="100" r="44" fill="none" stroke="#334155" stroke-width="1.2"/>
    <!-- Center Label (Yellow) -->
    <circle cx="100" cy="100" r="28" fill="#F59E0B" stroke="#1F242F" stroke-width="2"/>
    <circle cx="100" cy="100" r="6" fill="#FFF" stroke="#1F242F" stroke-width="2"/>
    <text x="100" y="93" fill="#1F242F" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="900" text-anchor="middle">TP SPACE</text>
    <text x="100" y="112" fill="#1F242F" font-family="'JetBrains Mono', monospace" font-size="6" text-anchor="middle">33 RPM</text>

    <!-- Tone Arm -->
    <circle cx="190" cy="35" r="12" fill="#94A3B8" stroke="#1F242F" stroke-width="2"/>
    <path d="M 190 35 L 165 110 L 140 125" fill="none" stroke="#1F242F" stroke-width="3" stroke-linecap="round"/>
    <rect x="130" y="120" width="14" height="8" rx="2" fill="#EF4444" stroke="#1F242F" stroke-width="1.5"/>

    <!-- Pitch Control Slider & Knobs -->
    <rect x="185" y="120" width="6" height="50" rx="3" fill="#CBD5E1" stroke="#1F242F" stroke-width="1.5"/>
    <circle cx="188" cy="140" r="5" fill="#3B82F6"/>
  </g>

  <!-- Large Over-Ear Headphones Floating & Vibrating -->
  <g transform="translate(340, 90)">
    <!-- Headband Arc -->
    <path d="M 30 110 C 30 0 170 0 170 110" fill="none" stroke="#1F242F" stroke-width="7" stroke-linecap="round"/>
    <!-- Left Ear Cup -->
    <rect x="15" y="95" width="30" height="55" rx="15" fill="#F59E0B" stroke="#1F242F" stroke-width="2.5"/>
    <rect x="23" y="105" width="14" height="35" rx="7" fill="#1E293B"/>
    <!-- Right Ear Cup -->
    <rect x="155" y="95" width="30" height="55" rx="15" fill="#F59E0B" stroke="#1F242F" stroke-width="2.5"/>
    <rect x="163" y="105" width="14" height="35" rx="7" fill="#1E293B"/>
    <!-- Center Sound Spectrum Badge -->
    <g transform="translate(60, 60)">
      <rect width="80" height="40" rx="6" fill="#1E293B" stroke="#1F242F" stroke-width="2"/>
      <text x="40" y="24" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">♫ 128 BPM</text>
    </g>
  </g>

  <!-- Flowing Musical & Code Notes Wave (Bottom Stream) -->
  <g transform="translate(70, 320)">
    <rect width="470" height="85" rx="10" fill="#FFF" stroke="#1F242F" stroke-width="2.2" filter="drop-shadow(3px 3px 0px #1F242F)"/>
    <!-- Sound Waves -->
    <path d="M 20 42 Q 60 10 100 42 T 180 42 T 260 42 T 340 42 T 420 42" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 42 Q 60 70 100 42 T 180 42 T 260 42 T 340 42 T 420 42" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <!-- Floating Pills -->
    <g transform="translate(30, 20)">
      <rect width="75" height="20" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
      <text x="37" y="14" fill="#B45309" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">const vibe = 100;</text>
    </g>
    <g transform="translate(170, 48)">
      <rect width="90" height="20" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
      <text x="45" y="14" fill="#1D4ED8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">music.play('Lo-Fi');</text>
    </g>
    <g transform="translate(320, 20)">
      <rect width="80" height="20" rx="4" fill="#DCFCE7" stroke="#10B981" stroke-width="1"/>
      <text x="40" y="14" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">flowState.enter();</text>
    </g>
  </g>

  <!-- Musical Notes in Air -->
  <text x="280" y="150" fill="#F59E0B" font-size="22" font-weight="900">♪</text>
  <text x="310" y="180" fill="#3B82F6" font-size="28" font-weight="900">♫</text>
  <text x="490" y="140" fill="#EC4899" font-size="20" font-weight="900">♩</text>
</svg>
