<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <pattern id="gridPat11" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E0D8" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#bgGrad11)" stroke="#1F242F" stroke-width="2.5"/>
  <rect width="600" height="450" rx="16" fill="url(#gridPat11)" opacity="0.65"/>

  <!-- Title Badge Top Left -->
  <g transform="translate(30, 30)">
    <rect width="210" height="28" rx="6" fill="#1F242F"/>
    <text x="105" y="18" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">95 WINDOWS / 九十五个窗口</text>
  </g>

  <!-- Big Watermark 95 in Center Background -->
  <text x="300" y="310" font-family="'JetBrains Mono', monospace" font-size="180" font-weight="900" fill="#1F242F" opacity="0.06" text-anchor="middle">95</text>

  <!-- Layered Cascading Chat Window Tiles (Isometric & Floating) -->
  <!-- Window 1: Deep Background Left -->
  <g transform="translate(80, 80) rotate(-4)">
    <rect width="130" height="85" rx="6" fill="#FFF" stroke="#1F242F" stroke-width="2" filter="drop-shadow(3px 3px 0px #1F242F)"/>
    <rect width="130" height="16" rx="6 6 0 0" fill="#94A3B8"/>
    <circle cx="8" cy="8" r="2.5" fill="#EF4444"/>
    <circle cx="16" cy="8" r="2.5" fill="#F59E0B"/>
    <circle cx="24" cy="8" r="2.5" fill="#10B981"/>
    <text x="10" y="36" font-family="'JetBrains Mono', monospace" font-size="8" fill="#1E293B">Window #01: Claude</text>
    <rect x="10" y="44" width="90" height="8" rx="2" fill="#E2E8F0"/>
    <rect x="10" y="56" width="60" height="8" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Window 2: Background Right -->
  <g transform="translate(380, 80) rotate(5)">
    <rect width="140" height="90" rx="6" fill="#FFF" stroke="#1F242F" stroke-width="2" filter="drop-shadow(3px 3px 0px #1F242F)"/>
    <rect width="140" height="16" rx="6 6 0 0" fill="#3B82F6"/>
    <text x="10" y="36" font-family="'JetBrains Mono', monospace" font-size="8" fill="#1D4ED8" font-weight="700">Window #12: WeChat</text>
    <rect x="10" y="44" width="110" height="8" rx="2" fill="#DBEAFE"/>
    <rect x="10" y="56" width="80" height="8" rx="2" fill="#DBEAFE"/>
  </g>

  <!-- Window 3: Midground Left (UniEmail) -->
  <g transform="translate(60, 210) rotate(2)">
    <rect width="150" height="95" rx="8" fill="#FFF" stroke="#1F242F" stroke-width="2" filter="drop-shadow(3px 3px 0px #1F242F)"/>
    <rect width="150" height="18" rx="8 8 0 0" fill="#10B981"/>
    <text x="10" y="38" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#15803D" font-weight="700">Window #42: UniEmail</text>
    <text x="10" y="54" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#64748B">Crawling scholars...</text>
    <rect x="10" y="64" width="120" height="12" rx="3" fill="#DCFCE7"/>
    <text x="70" y="73" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">✓ 21 Schools Done</text>
  </g>

  <!-- Window 4: Midground Right (3D Point Cloud) -->
  <g transform="translate(390, 200) rotate(-3)">
    <rect width="150" height="95" rx="8" fill="#FFF" stroke="#1F242F" stroke-width="2" filter="drop-shadow(3px 3px 0px #1F242F)"/>
    <rect width="150" height="18" rx="8 8 0 0" fill="#F59E0B"/>
    <text x="10" y="38" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#B45309" font-weight="700">Window #78: 3D Cloud</text>
    <text x="10" y="54" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#64748B">Segmenting pipeline...</text>
    <rect x="10" y="64" width="120" height="12" rx="3" fill="#FEF3C7"/>
    <text x="70" y="73" fill="#B45309" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">● RTX 4060 Active</text>
  </g>

  <!-- Window 5: Foreground Hero Center Window (Window #95) -->
  <g transform="translate(200, 160)">
    <rect width="200" height="140" rx="10" fill="#1E293B" stroke="#1F242F" stroke-width="2.5" filter="drop-shadow(5px 5px 0px #1F242F)"/>
    <rect width="200" height="24" rx="10 10 0 0" fill="#0F172A"/>
    <circle cx="12" cy="12" r="4" fill="#EF4444"/>
    <circle cx="24" cy="12" r="4" fill="#F59E0B"/>
    <circle cx="36" cy="12" r="4" fill="#10B981"/>
    <text x="50" y="16" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800">Window #95: The World</text>
    
    <!-- Code / Chat Output Inside -->
    <text x="14" y="46" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">&gt; connect(world.nodes);</text>
    <text x="14" y="64" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">&gt; "代码是表达，技术是艺术"</text>
    <text x="14" y="82" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">&gt; "一个人可以是一个节点"</text>
    <rect x="14" y="98" width="170" height="22" rx="4" fill="#334155"/>
    <text x="99" y="113" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" text-anchor="middle">⚡ 95 Channels Online</text>
  </g>

  <!-- Connecting Beams from Central Window to all surrounding windows -->
  <g stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4,4" fill="none" opacity="0.7">
    <line x1="200" y1="180" x2="160" y2="130"/>
    <line x1="400" y1="180" x2="430" y2="130"/>
    <line x1="200" y1="260" x2="160" y2="270"/>
    <line x1="400" y1="260" x2="430" y2="270"/>
  </g>

  <!-- Quote Banner (Bottom) -->
  <g transform="translate(130, 360)">
    <rect width="340" height="42" rx="8" fill="#1F242F"/>
    <text x="170" y="25" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">“他用了九十五个聊天窗口连接了全世界”</text>
  </g>
</svg>
