<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <pattern id="gridPat4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E0D8" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#bgGrad4)" stroke="#1F242F" stroke-width="2.5"/>
  <rect width="600" height="450" rx="16" fill="url(#gridPat4)" opacity="0.65"/>

  <!-- Title Badge Top Left -->
  <g transform="translate(30, 30)">
    <rect width="180" height="28" rx="6" fill="#1F242F"/>
    <text x="90" y="18" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">AGENT SWARM / 多Agent协作</text>
  </g>

  <!-- Central Round Table / Holographic Pad (Isometric) -->
  <ellipse cx="300" cy="270" rx="210" ry="90" fill="#E2E8F0" stroke="#1F242F" stroke-width="2.5"/>
  <ellipse cx="300" cy="270" rx="170" ry="70" fill="#F8FAFC" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Flow Arrows connecting the Agents on Table -->
  <path d="M 180 260 Q 300 210 420 260" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8,6"/>
  <path d="M 420 280 Q 300 330 180 280" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8,6"/>

  <!-- Holographic Task Floating Center -->
  <g transform="translate(300, 240)">
    <polygon points="0,-40 35,-15 35,25 0,50 -35,25 -35,-15" fill="#3B82F6" opacity="0.15" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="0" cy="5" r="16" fill="#FFF" stroke="#1F242F" stroke-width="2"/>
    <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#1F242F" text-anchor="middle">⚙️</text>
    <rect x="-45" y="-60" width="90" height="18" rx="4" fill="#1E293B"/>
    <text x="0" y="-48" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">Task: Sync &amp; Build</text>
  </g>

  <!-- Agent 1: Researcher / Planner (Left) -->
  <g transform="translate(130, 200)">
    <!-- Robot Head -->
    <rect x="-24" y="-30" width="48" height="40" rx="8" fill="#FFF" stroke="#1F242F" stroke-width="2.2"/>
    <line x1="0" y1="-30" x2="0" y2="-40" stroke="#1F242F" stroke-width="2"/>
    <circle cx="0" cy="-42" r="4" fill="#F59E0B" stroke="#1F242F" stroke-width="1.5"/>
    <!-- Screen Face -->
    <rect x="-18" y="-24" width="36" height="26" rx="4" fill="#0F172A"/>
    <circle cx="-7" cy="-11" r="3" fill="#38BDF8"/>
    <circle cx="7" cy="-11" r="3" fill="#38BDF8"/>
    <!-- Body -->
    <rect x="-20" y="14" width="40" height="36" rx="6" fill="#FEF3C7" stroke="#1F242F" stroke-width="2.2"/>
    <text x="0" y="36" font-size="12" text-anchor="middle">🔍</text>
    <!-- Label -->
    <rect x="-35" y="56" width="70" height="18" rx="4" fill="#1F242F"/>
    <text x="0" y="68" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">Research Agent</text>
  </g>

  <!-- Agent 2: Coder / Developer (Top Center) -->
  <g transform="translate(300, 110)">
    <rect x="-24" y="-30" width="48" height="40" rx="8" fill="#FFF" stroke="#1F242F" stroke-width="2.2"/>
    <line x1="0" y1="-30" x2="0" y2="-40" stroke="#1F242F" stroke-width="2"/>
    <circle cx="0" cy="-42" r="4" fill="#3B82F6" stroke="#1F242F" stroke-width="1.5"/>
    <rect x="-18" y="-24" width="36" height="26" rx="4" fill="#0F172A"/>
    <text x="0" y="-8" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">&gt;_</text>
    <rect x="-20" y="14" width="40" height="36" rx="6" fill="#DBEAFE" stroke="#1F242F" stroke-width="2.2"/>
    <text x="0" y="36" font-size="12" text-anchor="middle">💻</text>
    <rect x="-30" y="56" width="60" height="18" rx="4" fill="#1F242F"/>
    <text x="0" y="68" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">Code Agent</text>
  </g>

  <!-- Agent 3: Critic / QA Tester (Right) -->
  <g transform="translate(470, 200)">
    <rect x="-24" y="-30" width="48" height="40" rx="8" fill="#FFF" stroke="#1F242F" stroke-width="2.2"/>
    <line x1="0" y1="-30" x2="0" y2="-40" stroke="#1F242F" stroke-width="2"/>
    <circle cx="0" cy="-42" r="4" fill="#10B981" stroke="#1F242F" stroke-width="1.5"/>
    <rect x="-18" y="-24" width="36" height="26" rx="4" fill="#0F172A"/>
    <circle cx="-7" cy="-11" r="3" fill="#4ADE80"/>
    <circle cx="7" cy="-11" r="3" fill="#4ADE80"/>
    <rect x="-20" y="14" width="40" height="36" rx="6" fill="#DCFCE7" stroke="#1F242F" stroke-width="2.2"/>
    <text x="0" y="36" font-size="12" text-anchor="middle">🛡️</text>
    <rect x="-30" y="56" width="60" height="18" rx="4" fill="#1F242F"/>
    <text x="0" y="68" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">Audit Agent</text>
  </g>

  <!-- Agent 4: Deployment & Ops (Bottom Center) -->
  <g transform="translate(300, 330)">
    <rect x="-24" y="-24" width="48" height="36" rx="8" fill="#FFF" stroke="#1F242F" stroke-width="2.2"/>
    <rect x="-18" y="-18" width="36" height="22" rx="4" fill="#0F172A"/>
    <circle cx="-6" cy="-7" r="3" fill="#F43F5E"/>
    <circle cx="6" cy="-7" r="3" fill="#F43F5E"/>
    <rect x="-20" y="16" width="40" height="30" rx="6" fill="#FFE4E6" stroke="#1F242F" stroke-width="2.2"/>
    <text x="0" y="35" font-size="12" text-anchor="middle">🚀</text>
    <rect x="-30" y="52" width="60" height="18" rx="4" fill="#1F242F"/>
    <text x="0" y="64" fill="#FB7185" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">Deploy Ops</text>
  </g>

  <!-- Floating Signal Particles -->
  <circle cx="210" cy="180" r="3" fill="#F59E0B"/>
  <circle cx="390" cy="180" r="3" fill="#10B981"/>
  <circle cx="230" cy="310" r="3" fill="#3B82F6"/>
  <circle cx="370" cy="310" r="3" fill="#F43F5E"/>
</svg>
