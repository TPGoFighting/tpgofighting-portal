<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <pattern id="gridPat5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E0D8" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#bgGrad5)" stroke="#1F242F" stroke-width="2.5"/>
  <rect width="600" height="450" rx="16" fill="url(#gridPat5)" opacity="0.65"/>

  <!-- Title Badge Top Left -->
  <g transform="translate(30, 30)">
    <rect width="200" height="28" rx="6" fill="#1F242F"/>
    <text x="100" y="18" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">3D POINT CLOUD / 点云检测</text>
  </g>

  <!-- 3D Cylindrical Tunnel Wireframe in Perspective -->
  <g stroke="#1F242F" stroke-width="1.8" fill="none">
    <!-- Tunnel Outer Rings -->
    <ellipse cx="220" cy="230" rx="140" ry="110"/>
    <ellipse cx="320" cy="230" rx="110" ry="85" stroke-dasharray="4,4"/>
    <ellipse cx="400" cy="230" rx="80" ry="60" stroke-dasharray="4,4"/>
    <ellipse cx="460" cy="230" rx="50" ry="38"/>
    <!-- Longitudinal Guidelines -->
    <line x1="80" y1="230" x2="410" y2="230"/>
    <line x1="220" y1="120" x2="460" y2="192"/>
    <line x1="220" y1="340" x2="460" y2="268"/>
    <line x1="120" y1="150" x2="430" y2="200"/>
    <line x1="120" y1="310" x2="430" y2="260"/>
  </g>

  <!-- Point Cloud Particle Grid along Tunnel Surface -->
  <!-- Top Arch Points (Segmented Defect Highlights in Red/Orange) -->
  <g fill="#EF4444">
    <circle cx="160" cy="140" r="3"/>
    <circle cx="175" cy="135" r="3.5"/>
    <circle cx="190" cy="132" r="3"/>
    <circle cx="210" cy="130" r="4"/>
    <circle cx="230" cy="132" r="3"/>
    <circle cx="250" cy="138" r="3.5"/>
    <!-- Defect Bounding Box -->
    <rect x="150" y="120" width="110" height="30" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="205" y="112" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">Defect: Crack #01</text>
  </g>

  <!-- Normal Pipe Point Cloud Points (Cyan & Blue) -->
  <g fill="#0EA5E9">
    <circle cx="95" cy="200" r="2.5"/>
    <circle cx="100" cy="230" r="3"/>
    <circle cx="105" cy="260" r="2.5"/>
    <circle cx="120" cy="290" r="3"/>
    <circle cx="150" cy="320" r="2.5"/>
    <circle cx="180" cy="335" r="3"/>
    <circle cx="220" cy="340" r="3"/>
    <circle cx="260" cy="335" r="2.5"/>
    <circle cx="290" cy="320" r="3"/>
    <circle cx="320" cy="290" r="2.5"/>
    <circle cx="340" cy="260" r="3"/>
    <circle cx="345" cy="230" r="3"/>
    <circle cx="340" cy="200" r="2.5"/>
  </g>

  <g fill="#3B82F6">
    <circle cx="270" cy="180" r="2"/>
    <circle cx="280" cy="200" r="2.5"/>
    <circle cx="300" cy="220" r="2"/>
    <circle cx="320" cy="210" r="2.5"/>
    <circle cx="350" cy="220" r="2"/>
    <circle cx="380" cy="220" r="2"/>
    <circle cx="420" cy="225" r="2"/>
  </g>

  <!-- LiDAR Scanning Sensor Device & Ray Cone (Left) -->
  <g transform="translate(100, 310)">
    <!-- Tripod Base -->
    <line x1="0" y1="30" x2="-25" y2="75" stroke="#1F242F" stroke-width="3"/>
    <line x1="0" y1="30" x2="25" y2="75" stroke="#1F242F" stroke-width="3"/>
    <line x1="0" y1="30" x2="0" y2="78" stroke="#1F242F" stroke-width="3"/>
    <!-- Scanner Unit -->
    <rect x="-16" y="0" width="32" height="30" rx="4" fill="#3B82F6" stroke="#1F242F" stroke-width="2.5"/>
    <!-- Rotating LiDAR Dome -->
    <ellipse cx="0" cy="-5" rx="14" ry="10" fill="#F59E0B" stroke="#1F242F" stroke-width="2"/>
    <!-- Laser Beam Rays -->
    <path d="M 0 -5 L 140 -170 L 260 -150 Z" fill="#F59E0B" opacity="0.2"/>
    <line x1="0" y1="-5" x2="140" y2="-170" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4,4"/>
    <line x1="0" y1="-5" x2="260" y2="-150" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4,4"/>
  </g>

  <!-- AI Inference Badge (Right Side) -->
  <g transform="translate(450, 90)">
    <rect width="120" height="70" rx="8" fill="#1E293B" stroke="#1F242F" stroke-width="2" filter="drop-shadow(3px 3px 0px #1F242F)"/>
    <text x="14" y="22" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800">PointNet++</text>
    <text x="14" y="38" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="8">● RTX 4060: 42fps</text>
    <text x="14" y="52" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8">● Accuracy: 98.4%</text>
  </g>
</svg>
