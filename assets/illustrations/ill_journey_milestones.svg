<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5EFE6" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <pattern id="gridPat1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E0D8" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#skyGrad1)" stroke="#1F242F" stroke-width="2.5"/>
  <rect width="600" height="450" rx="16" fill="url(#gridPat1)" opacity="0.65"/>

  <!-- Starry Background Constellation -->
  <g stroke="#1F242F" stroke-width="1.2" opacity="0.35">
    <line x1="80" y1="70" x2="140" y2="50"/>
    <line x1="140" y1="50" x2="220" y2="80"/>
    <line x1="220" y1="80" x2="310" y2="40"/>
    <line x1="450" y1="70" x2="520" y2="110"/>
    <line x1="520" y1="110" x2="480" y2="160"/>
  </g>
  <circle cx="80" cy="70" r="3.5" fill="#F59E0B" stroke="#1F242F" stroke-width="1.5"/>
  <circle cx="140" cy="50" r="4.5" fill="#3B82F6" stroke="#1F242F" stroke-width="1.5"/>
  <circle cx="220" cy="80" r="3" fill="#10B981" stroke="#1F242F" stroke-width="1.5"/>
  <circle cx="310" cy="40" r="5" fill="#F59E0B" stroke="#1F242F" stroke-width="1.5"/>
  <circle cx="450" cy="70" r="4" fill="#6366F1" stroke="#1F242F" stroke-width="1.5"/>
  <circle cx="520" cy="110" r="3.5" fill="#EC4899" stroke="#1F242F" stroke-width="1.5"/>

  <!-- Mountain Silhouettes in distance -->
  <polygon points="40,290 120,200 210,290" fill="#E8E2D5" stroke="#1F242F" stroke-width="2"/>
  <polygon points="160,290 260,170 360,290" fill="#DDD5C7" stroke="#1F242F" stroke-width="2"/>
  <polygon points="310,290 410,210 500,290" fill="#E8E2D5" stroke="#1F242F" stroke-width="2"/>

  <!-- Isometric Winding Journey Pathway -->
  <path d="M 60 380 Q 180 370 240 310 T 380 230 T 480 150 L 520 165 Q 420 250 300 330 T 120 400 Z" fill="#F0EDE4" stroke="#1F242F" stroke-width="2.5"/>
  <!-- Pathway Dashed Centerline -->
  <path d="M 90 390 Q 200 350 280 290 T 440 190 L 490 155" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6,6"/>

  <!-- Milestone Flag / Nodes -->
  <!-- Node 1: Origin (Langxi) -->
  <g transform="translate(100, 360)">
    <circle cx="0" cy="0" r="16" fill="#FFF" stroke="#1F242F" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="7" fill="#F59E0B"/>
    <rect x="24" y="-18" width="80" height="24" rx="4" fill="#1F242F"/>
    <text x="64" y="-3" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">2024 · 起点</text>
  </g>

  <!-- Node 2: NJUPT College -->
  <g transform="translate(240, 290)">
    <circle cx="0" cy="0" r="16" fill="#FFF" stroke="#1F242F" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="7" fill="#3B82F6"/>
    <rect x="-95" y="-30" width="90" height="24" rx="4" fill="#3B82F6" stroke="#1F242F" stroke-width="1.5"/>
    <text x="-50" y="-15" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">南邮 633分</text>
  </g>

  <!-- Node 3: Microtech & Research -->
  <g transform="translate(360, 220)">
    <circle cx="0" cy="0" r="16" fill="#FFF" stroke="#1F242F" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="7" fill="#10B981"/>
    <rect x="24" y="-18" width="96" height="24" rx="4" fill="#10B981" stroke="#1F242F" stroke-width="1.5"/>
    <text x="72" y="-3" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">3D 点云 &amp; 实习</text>
  </g>

  <!-- Node 4: AI Agent Future -->
  <g transform="translate(480, 140)">
    <circle cx="0" cy="0" r="20" fill="#F59E0B" stroke="#1F242F" stroke-width="2.5"/>
    <polygon points="0,-12 10,8 -10,8" fill="#FFF"/>
    <!-- Glowing beacon rays -->
    <line x1="0" y1="-26" x2="0" y2="-40" stroke="#F59E0B" stroke-width="2.5"/>
    <line x1="-18" y1="-18" x2="-28" y2="-28" stroke="#F59E0B" stroke-width="2.5"/>
    <line x1="18" y1="-18" x2="28" y2="-28" stroke="#F59E0B" stroke-width="2.5"/>
    <rect x="-45" y="-55" width="90" height="24" rx="4" fill="#1F242F"/>
    <text x="0" y="-40" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle">2026 · AI 独立</text>
  </g>

  <!-- Traveler Character with Laptop & Backpack -->
  <g transform="translate(260, 240)">
    <!-- Backpack -->
    <rect x="-14" y="6" width="12" height="18" rx="3" fill="#F59E0B" stroke="#1F242F" stroke-width="2"/>
    <!-- Body -->
    <rect x="-6" y="4" width="16" height="24" rx="4" fill="#3B82F6" stroke="#1F242F" stroke-width="2"/>
    <!-- Head & Hair -->
    <circle cx="2" cy="-4" r="8" fill="#FFF" stroke="#1F242F" stroke-width="2"/>
    <path d="M -6 -8 Q 4 -12 10 -4 Q 8 -1 2 -2 Z" fill="#1F242F"/>
    <!-- Legs walking -->
    <line x1="-2" y1="28" x2="-8" y2="44" stroke="#1F242F" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="28" x2="14" y2="42" stroke="#1F242F" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Laptop in Hand -->
    <polygon points="10,12 24,10 26,18 12,20" fill="#FFF" stroke="#1F242F" stroke-width="1.8"/>
    <!-- Floating Sparkles -->
    <text x="24" y="-8" fill="#F59E0B" font-size="14" font-weight="900">✦</text>
  </g>

  <!-- Floating UI Window & Code Bubble -->
  <g transform="translate(180, 120)">
    <rect width="110" height="60" rx="6" fill="#FFF" stroke="#1F242F" stroke-width="2" filter="drop-shadow(3px 3px 0px #1F242F)"/>
    <line x1="0" y1="18" x2="110" y2="18" stroke="#1F242F" stroke-width="1.5"/>
    <circle cx="10" cy="9" r="3" fill="#EF4444"/>
    <circle cx="20" cy="9" r="3" fill="#F59E0B"/>
    <circle cx="30" cy="9" r="3" fill="#10B981"/>
    <text x="12" y="36" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1F242F" font-weight="700">int main() {</text>
    <text x="20" y="50" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F59E0B" font-weight="700">printf("❤");</text>
  </g>

  <!-- Title Badge Bottom Left -->
  <g transform="translate(30, 30)">
    <rect width="140" height="28" rx="6" fill="#1F242F"/>
    <text x="70" y="18" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">JOURNEY / 经历轨迹</text>
  </g>
</svg>
