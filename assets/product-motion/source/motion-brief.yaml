concept_contract: source/concept-contract.yaml
identity_bible: null
parameter_space: linear
media_access: random
gesture_policy:
  unit: continuous
  inertia: coalesce
  while_active: retarget
  boundary: clamp
  programmatic_navigation: observe
storyboard:
  - sparse label and base frame appear
  - primary product surface enters
  - product-specific working details assemble
  - completed scene holds while card remains visible
keyframes: [K0-outline, K1-surface, K2-details, K3-complete]
clip_chain: K0-to-K1-to-K2-to-K3
rest_state: K3-complete for reduced motion and off-runtime fallback
loop: none
anchor: center
scene_continuity: null
frame_policy: native
target_fps: 60
quality_target: Scalable DOM/SVG vector artwork; 460x288 desktop visual area at DPR 2, simplified 320x200 mobile area.
reduced_motion: K3-complete with no scroll writes or animated transitions.
